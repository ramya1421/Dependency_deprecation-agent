repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy src
        language: system
        types: [python]
        pass_filenames: false

      - id: max-file-lines
        name: enforce 300-line file limit (CLAUDE.md Architecture Rules)
        entry: python scripts/check_file_length.py
        language: system
        files: ^src/.*\.py$
