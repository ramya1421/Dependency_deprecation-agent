[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dda"
version = "0.1.0"
description = "Dependency Deprecation Agent — cited migration plans for deprecated, vulnerable, and EOL dependencies."
requires-python = ">=3.11"
dependencies = [
    "packaging",
    "fastapi",
    "uvicorn[standard]",
    "streamlit",
    "typer",
    "rich",
    "httpx",
    "tenacity",
    "pydantic>=2",
    "pydantic-settings",
    "python-dotenv",
    "qdrant-client",
    "sentence-transformers",
    "rank-bm25",
    "langgraph",
    "google-genai",
    "groq",
    "pathspec",
    "tree-sitter",
    "tree-sitter-javascript",
    "transformers",
]

[project.scripts]
dda = "dda.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dda"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

# Ruff has no native rule for max lines per file (Pylint's C0302 "too-many-lines"
# is not implemented in Ruff as of this writing). The 300-line file cap from
# DEVELOPMENT.md is enforced instead by the local `max-file-lines` hook in
# .pre-commit-config.yaml.

# mypy's python_version governs which syntax mypy accepts — it does not
# relax requires-python above, which stays the real runtime floor. Forced up
# from 3.11 to 3.12 because numpy>=2.5's bundled .pyi stubs (pulled in
# transitively now that tokenizer.py imports `transformers`) use PEP 695
# `type` statements that mypy cannot even parse below 3.12 — this is a
# stub-parsing limitation in a dependency, not a check on our own code, and
# `follow_imports = "skip"` does not avoid it (mypy still parses the
# top-level stub before an override can apply).
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
