# Render Blueprint — deploy with: Dashboard → New → Blueprint → connect repo
#
# Deployed services:
#   API: https://dda-api-cy9o.onrender.com
#   UI:  https://dda-ui.onrender.com
#
# Requires these secrets set in Render Dashboard → Environment:
#   GEMINI_API_KEY, GROQ_API_KEY, QDRANT_URL, QDRANT_API_KEY
# Optional: GITHUB_TOKEN (raises GitHub API rate limit 60→5000 req/hr)

services:
  - type: web
    name: dda-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_PATH
        value: /app/db/dda.db
      - key: LOG_LEVEL
        value: INFO
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  - type: web
    name: dda-ui
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    dockerCommand: >
      streamlit run src/dda/infrastructure/ui.py
      --server.port=$PORT
      --server.address=0.0.0.0
      --server.headless=true
    envVars:
      - key: DDA_API_URL
        value: https://dda-api-cy9o.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
